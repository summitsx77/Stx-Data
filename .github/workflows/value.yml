name: value-data
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/Value.yml', 'routinen/value_fetch.py']
  schedule:
    - cron: '41 2 * * 0'   # sonntags; holt die jüngsten Quartale und Faktordaten nach
permissions:
  contents: write
concurrency:
  group: value-data
  cancel-in-progress: false
jobs:
  value:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow
      - name: Value-Daten
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          MAX_Q: '80'
        run: python routinen/value_fetch.py
      - name: Commit
        if: always()
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add data/value
          git commit -m "value $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 20; done
