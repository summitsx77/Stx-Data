name: value-data
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/value.yml', 'routinen/value_fetch.py', 'routinen/value_cik_muster.csv']
  schedule:
    - cron: '41 2 * * 0'   # sonntags; holt die jüngsten Quartale und Faktordaten nach
permissions:
  contents: write
concurrency:
  group: value-data
  cancel-in-progress: false
jobs:
  value:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow
      - name: Value-Daten
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          MAX_Q: '80'
        run: python routinen/value_fetch.py
      - name: Commit
        if: always()
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          rm -rf /tmp/vsave && cp -r data/value /tmp/vsave
          for i in 1 2 3; do
            git fetch -q --depth 1 origin main && git reset -q --hard origin/main
            rm -rf data/value && cp -r /tmp/vsave data/value
            git add -A data/value
            git commit -q -m "value $(date -u +%F)" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep 20
          done
          echo 'Push fehlgeschlagen'; exit 1
