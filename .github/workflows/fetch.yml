name: fetch-data
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fetch.yml']
  schedule:
    - cron: '17 4 * * 2-6'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas pyarrow
      - name: Download
        shell: python
        run: |
          import os, io, time, zipfile, urllib.request
          import pandas as pd, yfinance as yf
          os.makedirs('data/yahoo', exist_ok=True)
          os.makedirs('data/french', exist_ok=True)
          T = ['EXSA.DE','^STOXX','^STOXX50E','CEMR.DE',
               'EXV1.DE','EXV2.DE','EXV3.DE','EXV4.DE','EXV5.DE','EXV6.DE','EXV7.DE','EXV8.DE','EXV9.DE',
               'EXH1.DE','EXH2.DE','EXH3.DE','EXH4.DE','EXH5.DE','EXH6.DE','EXH7.DE','EXH8.DE','EXH9.DE','EXI5.DE']
          log, meta = [], []
          for t in T:
              ok = False
              for k in range(3):
                  try:
                      tk = yf.Ticker(t)
                      df = tk.history(period='max', auto_adjust=False, actions=True)
                      if len(df):
                          df.to_csv('data/yahoo/' + t.replace('^', 'IDX_') + '.csv')
                          log.append(f'{t},{len(df)},{df.index[0].date()},{df.index[-1].date()}')
                          try:
                              i = tk.info
                              meta.append((t, i.get('longName') or i.get('shortName'), i.get('isin', '')))
                          except Exception:
                              meta.append((t, '', ''))
                          ok = True
                          break
                  except Exception as e:
                      print(t, e)
                  time.sleep(10 * (k + 1))
              if not ok:
                  log.append(f'{t},FAIL')
              time.sleep(3)
          pd.DataFrame(meta, columns=['ticker', 'name', 'isin']).to_csv('data/yahoo/_meta.csv', index=False)
          base = 'https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/'
          for f in ['Europe_Mom_Factor_CSV.zip', 'Europe_Mom_Factor_Daily_CSV.zip',
                    'Europe_6_Portfolios_ME_Prior_12_2_CSV.zip', 'Europe_25_Portfolios_ME_Prior_12_2_CSV.zip',
                    'Europe_3_Factors_CSV.zip']:
              try:
                  req = urllib.request.Request(base + f, headers={'User-Agent': 'Mozilla/5.0'})
                  z = zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(req, timeout=60).read()))
                  for n in z.namelist():
                      open('data/french/' + n, 'wb').write(z.read(n))
                  log.append(f'{f},OK')
              except Exception as e:
                  log.append(f'{f},FAIL {e}')
          open('data/_log.txt', 'w').write('\n'.join(log) + '\n')
          print('\n'.join(log))
      - name: Stocks
        shell: python
        run: |
          import os, io, time, re, urllib.request
          import pandas as pd, yfinance as yf
          os.makedirs('data/stocks', exist_ok=True)
          U = ['https://www.ishares.com/de/privatanleger/de/produkte/251931/ishares-stoxx-europe-600-ucits-etf-de-fund/1478358465952.ajax?fileType=csv&fileName=EXSA_holdings&dataType=fund',
               'https://www.ishares.com/uk/professional/en/products/251931/ishares-stoxx-europe-600-ucits-etf-de-fund/1506575576011.ajax?fileType=csv&fileName=EXSA_holdings&dataType=fund',
               'https://www.ishares.com/ch/professionals/en/products/251931/ishares-stoxx-europe-600-ucits-etf-de-fund/1495092304805.ajax?fileType=csv&fileName=EXSA_holdings&dataType=fund']
          raw, log = None, []
          for u in U:
              try:
                  b = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'}), timeout=60).read()
                  t = b.decode('utf-8-sig', errors='replace')
                  if t.count('\n') > 300:
                      raw = t; log.append('holdings OK ' + u[:60]); break
                  log.append('holdings short ' + u[:60])
              except Exception as e:
                  log.append(f'holdings FAIL {e}')
          if raw:
              open('data/stocks/holdings_raw.csv', 'w').write(raw)
              lines = raw.splitlines()
              h = next(i for i, l in enumerate(lines) if ('Ticker' in l and ('ISIN' in l or 'Name' in l)))
              df = pd.read_csv(io.StringIO('\n'.join(lines[h:])), sep=None, engine='python', on_bad_lines='skip')
              df.columns = [c.strip() for c in df.columns]
              tc = next(c for c in df.columns if 'Ticker' in c)
              ec = next((c for c in df.columns if c in ('Börse', 'Exchange', 'Boerse')), None)
              ac = next((c for c in df.columns if c in ('Anlageklasse', 'Asset Class')), None)
              if ac: df = df[df[ac].astype(str).str.contains('Aktie|Equity', na=False)]
              SUF = [('xetra','.DE'),('deutsche','.DE'),('frankfurt','.DE'),('paris','.PA'),('amsterdam','.AS'),('brussels','.BR'),('brüssel','.BR'),
                     ('lisbon','.LS'),('lissabon','.LS'),('dublin','.IR'),('irish','.IR'),('london','.L'),('six','.SW'),('swiss','.SW'),('italiana','.MI'),
                     ('madrid','.MC'),('mercado continuo','.MC'),('stockholm','.ST'),('copenhagen','.CO'),('kopenhagen','.CO'),('helsinki','.HE'),
                     ('oslo','.OL'),('wien','.VI'),('wiener','.VI'),('vienna','.VI'),('warsaw','.WA'),('warschau','.WA'),('nordic','.ST'),('athens','.AT'),('athen','.AT'),('prague','.PR'),('prag','.PR')]
              rows = []
              for _, r in df.iterrows():
                  tk = str(r[tc]).strip(); ex = str(r[ec]).lower() if ec else ''
                  suf = next((s for k, s in SUF if k in ex), '')
                  y = re.sub(r'[ /]+', '-', tk.rstrip('.')) + suf
                  rows.append(dict(r, yahoo=y))
              m = pd.DataFrame(rows); m.to_csv('data/stocks/members.csv', index=False)
              tick = sorted(set(m['yahoo']))
              frames = []
              for i in range(0, len(tick), 40):
                  part = tick[i:i+40]
                  for k in range(3):
                      try:
                          d = yf.download(part, period='max', auto_adjust=False, actions=False, group_by='column', threads=True, progress=False)
                          if len(d): frames.append(d[['Adj Close', 'Volume']].loc['2000':].astype('float32')); break
                      except Exception as e:
                          print(e)
                      time.sleep(20)
                  time.sleep(5)
              if frames:
                  big = pd.concat(frames, axis=1)
                  big.columns = [f'{a}|{b}' for a, b in big.columns]
                  big.to_parquet('data/stocks/prices.parquet')
                  got = {c.split('|')[1] for c in big.columns if big[c].notna().any()}
                  log.append(f'stocks {len(got)}/{len(tick)} with data; missing: ' + ' '.join(sorted(set(tick) - got)))
          open('data/_log_stocks.txt', 'w').write('\n'.join(log) + '\n')
          print('\n'.join(log))
      - name: Insider
        shell: python
        run: |
          import os, io, time, zipfile, urllib.request, datetime
          import pandas as pd
          os.makedirs('data/insider', exist_ok=True)
          UA = {'User-Agent': 'Stx-Data research (GitHub Actions) stxdata@users.noreply.github.com', 'Accept-Encoding': 'identity'}
          out = 'data/insider/purchases.csv.gz'
          done_f = 'data/insider/_quarters_done.txt'
          done = set(open(done_f).read().split()) if os.path.exists(done_f) else set()
          old = pd.read_csv(out, dtype=str) if os.path.exists(out) else None
          today = datetime.date.today()
          qs = [f'{y}q{q}' for y in range(2006, today.year + 1) for q in range(1, 5) if (y, q) <= (today.year, (today.month - 1) // 3 + 1)]
          todo = [q for q in qs if q not in done] + [q for q in qs[-3:] if q in done]
          frames, log = [], []
          def rd(z, name):
              n = next(x for x in z.namelist() if x.upper().endswith(name + '.TSV'))
              return pd.read_csv(io.BytesIO(z.read(n)), sep='\t', dtype=str, on_bad_lines='skip', encoding_errors='replace')
          for q in todo:
              url = f'https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/{q}_form345.zip'
              try:
                  b = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=120).read()
                  z = zipfile.ZipFile(io.BytesIO(b))
                  sub = rd(z, 'SUBMISSION'); own = rd(z, 'REPORTINGOWNER'); nd = rd(z, 'NONDERIV_TRANS')
                  p = nd[nd['TRANS_CODE'] == 'P']; n_s = int((nd['TRANS_CODE'] == 'S').sum())
                  keep = [c for c in ['ACCESSION_NUMBER', 'SECURITY_TITLE', 'TRANS_DATE', 'TRANS_CODE', 'TRANS_SHARES', 'TRANS_PRICEPERSHARE',
                          'TRANS_ACQUIRED_DISP_CD', 'SHRS_OWND_FOLWNG_TRANS', 'DIRECT_INDIRECT_OWNERSHIP'] if c in p.columns]
                  p = p[keep]
                  sk = [c for c in ['ACCESSION_NUMBER', 'FILING_DATE', 'PERIOD_OF_REPORT', 'DOCUMENT_TYPE', 'ISSUERCIK', 'ISSUERNAME', 'ISSUERTRADINGSYMBOL', 'AFF10B5ONE'] if c in sub.columns]
                  ok_cols = [c for c in ['RPTOWNERCIK', 'RPTOWNERNAME', 'RPTOWNER_RELATIONSHIP', 'RPTOWNER_TITLE'] if c in own.columns]
                  o = own.groupby('ACCESSION_NUMBER')[ok_cols].agg(lambda s: '|'.join(s.dropna().astype(str))).reset_index()
                  m = p.merge(sub[sk], on='ACCESSION_NUMBER', how='left').merge(o, on='ACCESSION_NUMBER', how='left')
                  m['QUARTER'] = q
                  frames.append(m); done.add(q)
                  log.append(f'{q},OK,P {len(m)}, S {n_s}')
                  if q == todo[0]: log.append('cols: ' + ' '.join(sub.columns) + ' || ' + ' '.join(own.columns) + ' || ' + ' '.join(nd.columns))
              except Exception as e:
                  log.append(f'{q},FAIL {str(e)[:120]}')
              time.sleep(1)
          if frames:
              new = pd.concat(frames)
              if old is not None:
                  new = pd.concat([old[~old['QUARTER'].isin(new['QUARTER'].unique())], new])
              new.to_csv(out, index=False, compression='gzip')
              open(done_f, 'w').write('\n'.join(sorted(done)) + '\n')
          open('data/_log_insider.txt', 'w').write('\n'.join(log) + '\n')
          print('\n'.join(log))
      - name: Commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add data
          git commit -m "data $(date -u +%F)" || exit 0
          git push
