name: pe-trusts
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/pe.yml']
  schedule:
    - cron: '23 5 * * 5'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas pyarrow mstarpy
      - name: Kurse und NAV
        shell: python
        run: |
          import os, json, time, datetime as dt
          import pandas as pd, yfinance as yf
          os.makedirs('data/pe/prices', exist_ok=True)
          os.makedirs('data/pe/nav', exist_ok=True)
          os.makedirs('data/pe/raw', exist_ok=True)
          log = []
          # Trusts: Kuerzel, Yahoo-Ticker, Suchbegriffe Morningstar (ISIN zuerst, dann Name)
          TR = [
            ('III',  'III.L',  ['GB00B1YW4409', '3i Group']),
            ('HGT',  'HGT.L',  ['GB00BJ0LT190', 'HgCapital Trust']),
            ('OCI',  'OCI.L',  ['Oakley Capital Investments']),
            ('PIN',  'PIN.L',  ['Pantheon International']),
            ('HVPE', 'HVPE.L', ['HarbourVest Global Private Equity']),
            ('PPET', 'PPET.L', ['GB0030474687', 'Patria Private Equity Trust', 'abrdn Private Equity Opportunities']),
            ('ICGT', 'ICGT.L', ['ICG Enterprise Trust']),
            ('NBPE', 'NBPE.L', ['NB Private Equity Partners']),
            ('PEY',  'PEY.L',  ['Princess Private Equity']),
            ('APAX', 'APAX.L', ['Apax Global Alpha']),
            ('GROW', 'GROW.L', ['Molten Ventures', 'Draper Esprit']),
            ('CHRY', 'CHRY.L', ['Chrysalis Investments']),
            ('INOV', 'INOV.L', ['Schroders Capital Global Innovation', 'Schroder UK Public Private']),
            ('AUGM', 'AUGM.L', ['Augmentum Fintech']),
            ('SSIT', 'SSIT.L', ['Seraphim Space Investment Trust']),
          ]
          BM = ['SWDA.L', 'IWDA.AS', 'EUNL.DE', 'VWRL.L', 'IPRV.L', 'GBPEUR=X', '^FTAS']
          for t in [x[1] for x in TR] + BM:
              ok = False
              for k in range(3):
                  try:
                      df = yf.Ticker(t).history(period='max', auto_adjust=False, actions=True)
                      if len(df):
                          df.to_csv('data/pe/prices/' + t.replace('^', 'IDX_').replace('=', '_') + '.csv')
                          log.append(f'price {t},{len(df)},{df.index[0].date()},{df.index[-1].date()}')
                          ok = True
                          break
                  except Exception as e:
                      print(t, e)
                  time.sleep(8 * (k + 1))
              if not ok:
                  log.append(f'price {t},FAIL')
              time.sleep(2)
          # NAV ueber Morningstar: alle Treffer der Suche und alle IDs je Treffer probieren
          import requests, glob
          from mstarpy.search import MorningstarSession
          from mstarpy.utils import random_user_agent
          sess = MorningstarSession()
          tok = sess.token_chart()
          url = 'https://www.us-api.morningstar.com/QS-markets/chartservice/v2/timeseries'
          def ts(code, field, freq='d'):
              h = {'user-agent': random_user_agent(), 'authorization': f'Bearer {tok}'}
              p = {'query': f'{code}:{field}', 'frequency': freq, 'startDate': '1995-01-01',
                   'endDate': dt.date.today().isoformat(), 'trackMarketData': '3.6.3', 'instid': 'DOTCOM'}
              r = requests.get(url, params=p, headers=h, timeout=60)
              if r.status_code != 200:
                  return None, r.status_code
              j = r.json()
              return (j[0].get('series', []) if j else []), 200
          EXTRA = {'III': ['3i Group plc'], 'HGT': ['HgCapital Trust plc', 'Hg Capital Trust'], 'OCI': ['Oakley Capital'],
                   'PIN': ['Pantheon International plc'], 'PPET': ['Patria Private Equity'], 'ICGT': ['ICG Enterprise'],
                   'NBPE': ['NB Private Equity'], 'PEY': ['Princess Private Equity Holding', 'Princess'],
                   'GROW': ['Molten Ventures plc'], 'CHRY': ['Chrysalis'], 'SSIT': ['Seraphim Space'], 'AUGM': ['Augmentum']}
          for f in glob.glob('data/pe/nav/*.csv'):
              os.remove(f)
          search = {}
          for key, yt, terms in TR:
              if key in ('APAX',):
                  continue
              cands, items = [], []
              for term in terms + EXTRA.get(key, []):
                  try:
                      cl = sess.screener_universe(term, field=['isin', 'name'], pageSize=20)
                  except Exception as e:
                      items.append({'term': term, 'error': str(e)[:150]}); continue
                  for it in cl or []:
                      items.append({'term': term, **{k2: v2 for k2, v2 in it.items()}})
                      flat = json.dumps(it)
                      for c in set(__import__('re').findall(r'\b(?:F0[0-9A-Z]{8}|0P[0-9A-Z]{8}|FS[0-9A-Z]{8}|F00[0-9A-Z]{7})\b', flat)):
                          if c not in cands:
                              cands.append(c)
                  time.sleep(1)
              search[key] = {'cands': cands, 'items': items}
              best = None
              for c in cands[:25]:
                  try:
                      ser, st = ts(c, 'nav')
                  except Exception as e:
                      log.append(f'nav {key} {c},ERR {str(e)[:80]}'); continue
                  n = len(ser) if ser else 0
                  log.append(f'nav {key} {c},{st},{n}')
                  if n:
                      pd.json_normalize(ser).to_csv(f'data/pe/nav/{key}_{c}_nav.csv', index=False)
                      if best is None or n > best[1]:
                          best = (c, n)
                  time.sleep(1)
              log.append(f'nav {key} BEST,{best}')
          json.dump(search, open('data/pe/_search.json', 'w'), indent=1)
          open('data/pe/_log.txt', 'w').write('\n'.join(log) + '\n')
          print('\n'.join(log))
      - name: Commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add data/pe
          git commit -m "pe data $(date -u +%F)" || exit 0
          git pull --rebase
          git push
