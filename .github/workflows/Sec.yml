name: sec-fundamentals
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/Sec.yml', 'routinen/sec_fetch.py', 'routinen/cik_overrides.csv']
  schedule:
    - cron: '23 3 * * 0'   # sonntags; der Erstabruf braucht mehrere Läufe (30 Quartale je Lauf)
permissions:
  contents: write
concurrency:
  group: sec-fundamentals
  cancel-in-progress: false
jobs:
  sec:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow
      - name: SEC-Daten
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          MAX_Q: '30'
        run: python routinen/sec_fetch.py
      - name: Commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add data/sec
          git commit -m "sec $(date -u +%F)" || exit 0
          git pull --rebase --autostash || true
          git push
